name = "xtream-media-proxy"
main = "xtream-proxy.js"
compatibility_date = "2024-11-14"
compatibility_flags = ["nodejs_compat"]

# KV Namespace - disabled for now
# [[kv_namespaces]]
# binding = "XTREAM_CACHE"
# id = "your-kv-namespace-id-here"
# preview_id = "your-preview-kv-namespace-id-here"

# Environment variables (vars - not secrets, for temporary deployment)
# For production, use `wrangler secret put` instead of vars for credentials
[vars]
XTREAM_BASE_URL = "https://your-provider.com:2053"
# XTREAM_USERNAME and XTREAM_PASSWORD should be set as secrets: wrangler secret put XTREAM_USERNAME
# XTREAM_PASSWORD = "your-password"

# Optional: Custom domain (configure in Cloudflare dashboard after deploy)
# routes = [
#   { pattern = "xtream-proxy.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]