# Install nginx + the distro's http_geoip2 module on CUSTOMER-OWNED hardware.
# Load module in nginx.conf's main context. These blocks belong in http {}.
# A real, current, lawfully obtained country MMDB is REQUIRED. Never replace it
# with a constant country. Do not enable real_ip_header for arbitrary clients.
geoip2 /etc/cloudplay/country.mmdb {
  auto_reload 1h;
  $cloudplay_country country iso_code;
}
server {
  listen 443 ssl;
  server_name viewer.example.com; # replace with owned domain
  ssl_certificate /etc/cloudplay/public-fullchain.pem;
  ssl_certificate_key /etc/cloudplay/public-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log off; # media queries/cookies must not be logged
  client_max_body_size 1m;
  location /auth/v1/ {
    proxy_pass https://127.0.0.1:8443;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/cloudplay/auth-ca.pem;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_read_timeout 30s;
    proxy_redirect off;
  }
  location / {
    proxy_pass https://127.0.0.1:9443;
    proxy_ssl_server_name on;
    proxy_ssl_name gateway; # must match gateway cert SAN
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/cloudplay/gateway-ca.pem;
    proxy_ssl_certificate /etc/cloudplay/edge-client.pem;
    proxy_ssl_certificate_key /etc/cloudplay/edge-client-key.pem;
    proxy_set_header X-Cloudplay-Country $cloudplay_country;
    proxy_set_header X-Cloudplay-Client-IP $remote_addr;
    proxy_set_header X-Cloudplay-Edge "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_read_timeout 30s;
    proxy_redirect off;
  }
}
