# Opt-in ONLY after reading docs/SELFHOST_PUBLIC_INGRESS.md.
# Existing loopback local ports remain for backwards compatibility. On a public
# host firewall them AND deny all direct access to web/API containers.
services:
  web:
    environment:
      SELFHOST_TRUST_MTLS_EDGE: 'true'
      SELFHOST_EDGE_SECRET: ${SELFHOST_EDGE_SECRET:?Set a separate random edge key}
      EXTERNAL_GEO_SIGNING_KEY: ${EXTERNAL_GEO_SIGNING_KEY:?Set Geo key}
      VOD_PUBLIC_ORIGIN: ${VOD_PUBLIC_ORIGIN:?Set exact public HTTPS origin}
      API_INTERNAL_URL: https://api-gateway
      NODE_EXTRA_CA_CERTS: /ingress/api-ca.pem
    volumes:
      - ${SELFHOST_INGRESS_ROOT:?Set absolute operator-owned cert directory}/api-ca.pem:/ingress/api-ca.pem:ro
  api-gateway:
    image: nginx:1.28-alpine
    volumes:
      - ${SELFHOST_INGRESS_ROOT}/api-cert.pem:/tls/cert.pem:ro
      - ${SELFHOST_INGRESS_ROOT}/api-key.pem:/tls/key.pem:ro
      - ./selfhost-api-tls.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]
    depends_on:
      api: { condition: service_healthy }
  ingress:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ingress
    environment:
      SELFHOST_EDGE_SECRET: ${SELFHOST_EDGE_SECRET}
      VOD_PUBLIC_ORIGIN: ${VOD_PUBLIC_ORIGIN}
      INGRESS_KEY_FILE: /tls/gateway-key.pem
      INGRESS_CERT_FILE: /tls/gateway-cert.pem
      INGRESS_CLIENT_CA_FILE: /tls/edge-client-ca.pem
    volumes:
      - ${SELFHOST_INGRESS_ROOT}/gateway-key.pem:/tls/gateway-key.pem:ro
      - ${SELFHOST_INGRESS_ROOT}/gateway-cert.pem:/tls/gateway-cert.pem:ro
      - ${SELFHOST_INGRESS_ROOT}/edge-client-ca.pem:/tls/edge-client-ca.pem:ro
    ports: ["127.0.0.1:9443:8443"]
    networks: [internal]
    depends_on: [web]
