# Local/customer-owned resources only. Combine with compose.yml + compose.local.yml.
# The lifecycle CLI forces a unique project and explicit image release.
services:
  minio:
    image: cloudplay-selfhost-storage:${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.storage
      args:
        CLOUDPLAY_RELEASE: ${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
  minio-init:
    image: cloudplay-selfhost-storage:${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
  postgres:
    image: postgres:17
  api:
    build:
      args:
        CLOUDPLAY_RELEASE: ${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
    environment:
      NODE_EXTRA_CA_CERTS: /tls/cert.pem
    volumes: ["../../.selfhost/tls/cert.pem:/tls/cert.pem:ro"]
    image: cloudplay-selfhost-api:${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
  worker-media:
    build:
      args:
        CLOUDPLAY_RELEASE: ${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
    image: cloudplay-selfhost-worker:${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
  web:
    build:
      args:
        CLOUDPLAY_RELEASE: ${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Run selfhost init}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Run selfhost init}
    image: cloudplay-selfhost-web:${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
    environment:
      API_INTERNAL_URL: http://api:3000
  admin:
    build:
      args:
        CLOUDPLAY_RELEASE: ${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
    image: cloudplay-selfhost-admin:${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
  tools:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.tools
      args:
        CLOUDPLAY_RELEASE: ${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
    image: cloudplay-selfhost-tools:${SELFHOST_RELEASE:?Set SELFHOST_RELEASE}
    env_file: [../../.env]
    environment:
      SELFHOST_LOCAL_ONLY: 'true'
      NODE_EXTRA_CA_CERTS: /tls/cert.pem
      STORAGE_ENDPOINT: http://minio:9000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?Set DEFAULT_TENANT_ID}
    networks: [internal]
    volumes: ["../../.selfhost/tls/cert.pem:/tls/cert.pem:ro"]
    profiles: [tools]
  auth:
    image: supabase/gotrue:v2.197.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://localhost:8443/auth/v1
      GOTRUE_SITE_URL: http://localhost:3001
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=auth
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Run selfhost init}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: auth@cloudplay.local
      GOTRUE_SMTP_SENDER_NAME: Cloud Play Local
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  auth-gateway:
    image: nginx:1.28-alpine
    volumes:
      - ../../.selfhost/tls:/tls:ro
      - ./selfhost-auth.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8443:443"]
    networks: [internal]
    depends_on:
      auth: { condition: service_healthy }
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["127.0.0.1:8025:8025"]
    networks: [internal]
